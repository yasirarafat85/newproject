<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GP Bill Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
/* ═══════════════════════════════════════
   TOKENS & RESET
═══════════════════════════════════════ */
:root {
  --bg:        #04080f;
  --s1:        #080e1a;
  --s2:        #0c1423;
  --s3:        #101c2e;
  --border:    rgba(0,180,255,.12);
  --border2:   rgba(0,180,255,.22);

  --cyan:      #00d4ff;
  --cyan-dim:  rgba(0,212,255,.15);
  --green:     #00e887;
  --green-dim: rgba(0,232,135,.12);
  --amber:     #ffb340;
  --amber-dim: rgba(255,179,64,.12);
  --red:       #ff4560;
  --red-dim:   rgba(255,69,96,.12);
  --purple:    #b47cff;
  --purple-dim:rgba(180,124,255,.1);

  --text:      #ddeeff;
  --muted:     #4a6b88;
  --faint:     #1e3050;

  --r-sm:  10px;
  --r-md:  16px;
  --r-lg:  22px;
  --r-xl:  28px;

  --font-sans: 'Space Grotesk', 'Noto Sans Bengali', sans-serif;
  --font-bn:   'Noto Sans Bengali', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; font-size:16px; }
body {
  font-family: var(--font-bn);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  /* Subtle grid pattern */
  background-image:
    linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px),
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,212,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 95% 95%, rgba(0,232,135,.05) 0%, transparent 50%);
  background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
}

/* ═══════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════ */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background: var(--s1); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius:4px; }

/* ═══════════════════════════════════════
   SWEETALERT OVERRIDES
═══════════════════════════════════════ */
.swal2-popup { background:var(--s2)!important; border:1px solid var(--border2)!important; border-radius:var(--r-xl)!important; font-family:var(--font-bn)!important; color:var(--text)!important; box-shadow:0 24px 80px rgba(0,0,0,.7)!important; }
.swal2-title { color:var(--text)!important; font-size:17px!important; font-family:var(--font-sans)!important; }
.swal2-html-container { color:var(--muted)!important; font-size:14px!important; }
.swal2-confirm { background:linear-gradient(135deg,#0099bb,var(--cyan))!important; color:#020810!important; font-weight:700!important; border-radius:12px!important; padding:11px 26px!important; font-family:var(--font-bn)!important; border:none!important; }
.swal2-cancel { background:var(--s3)!important; color:var(--muted)!important; border:1px solid var(--border)!important; border-radius:12px!important; padding:11px 26px!important; font-family:var(--font-bn)!important; }
.swal2-deny { background:linear-gradient(135deg,#cc2a3a,var(--red))!important; color:#fff!important; border-radius:12px!important; padding:11px 26px!important; font-family:var(--font-bn)!important; }
.swal2-icon.swal2-warning { border-color:var(--amber)!important; color:var(--amber)!important; }
.swal2-icon.swal2-error { border-color:var(--red)!important; color:var(--red)!important; }
.swal2-icon.swal2-success { border-color:var(--green)!important; color:var(--green)!important; }
.swal2-icon.swal2-success [class^=swal2-success-line] { background:var(--green)!important; }
.swal2-icon.swal2-success .swal2-success-ring { border-color:rgba(0,232,135,.3)!important; }
.swal2-input { background:var(--s3)!important; border:1px solid var(--border2)!important; color:var(--text)!important; border-radius:10px!important; font-family:var(--font-mono)!important; }
.swal2-actions { gap:10px!important; }
.swal2-backdrop-show { background:rgba(0,0,0,.85)!important; backdrop-filter:blur(12px)!important; }

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
.hidden { display:none!important; }
.glow-cyan { box-shadow:0 0 20px rgba(0,212,255,.2); }
.glow-green { box-shadow:0 0 20px rgba(0,232,135,.2); }

/* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(4,8,15,.92);
  backdrop-filter: blur(24px) saturate(1.8);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #006688, var(--cyan));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(0,212,255,.3);
}
.logo-text {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 18px;
  color: var(--text);
  letter-spacing: -.3px;
  line-height: 1;
}
.logo-text em { color: var(--cyan); font-style: normal; }

.bal-pill {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 6px 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--green);
  transition: all .3s;
  white-space: nowrap;
}
.bal-pill .dot {
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
.bal-pill.low { border-color:rgba(255,69,96,.3); color:var(--red); }
.bal-pill.low .dot { background:var(--red); }

.hdr-actions { display:flex; gap:6px; }
.hbtn {
  display: flex; align-items: center; gap: 5px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 7px 12px;
  border-radius: 40px;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font-bn);
  white-space: nowrap;
  touch-action: manipulation;
}
.hbtn:hover { border-color:var(--cyan); color:var(--cyan); }
.hbtn.danger { border-color:rgba(255,69,96,.35); color:var(--red); }
.hbtn.danger:hover { background:var(--red-dim); }
.hbtn.amber { border-color:rgba(255,179,64,.35); color:var(--amber); }
.hbtn.amber:hover { background:var(--amber-dim); }
.hbtn .icon { font-size:14px; }

/* ═══════════════════════════════════════
   MAIN LAYOUT WRAPPER
═══════════════════════════════════════ */
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 14px;
}

/* ═══════════════════════════════════════
   SEARCH
═══════════════════════════════════════ */
.search-area { padding: 14px 14px 0; max-width:760px; margin:0 auto; }
.search-box {
  position: relative;
}
.search-icon {
  position: absolute; left:14px; top:50%; transform:translateY(-50%);
  color: var(--muted); font-size:16px; pointer-events:none;
}
.search-input {
  width: 100%;
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 16px 13px 44px;
  border-radius: 14px;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
  font-family: var(--font-bn);
  -webkit-appearance: none;
}
.search-input:focus {
  border-color: var(--cyan);
  background: var(--s2);
  box-shadow: 0 0 0 3px rgba(0,212,255,.08);
}
.search-input::placeholder { color:var(--muted); }
.search-clear {
  position: absolute; right:14px; top:50%; transform:translateY(-50%);
  background: var(--s3); border:none; color:var(--muted);
  width:24px; height:24px; border-radius:50%;
  font-size:12px; cursor:pointer; display:none; align-items:center; justify-content:center;
  transition: all .2s;
}
.search-clear:hover { background:var(--red-dim); color:var(--red); }
.search-clear.show { display:flex; }

/* ═══════════════════════════════════════
   PROGRESS + STATS
═══════════════════════════════════════ */
.meta-strip { padding:14px 14px 0; max-width:760px; margin:0 auto; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.stat-tile {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat-tile::before {
  content:'';
  position:absolute; inset:0;
  opacity: .04;
}
.stat-tile.cyan::before { background:radial-gradient(circle at 50% 0%,var(--cyan),transparent 70%); opacity:.15; }
.stat-tile.green::before { background:radial-gradient(circle at 50% 0%,var(--green),transparent 70%); opacity:.15; }
.stat-tile.amber::before { background:radial-gradient(circle at 50% 0%,var(--amber),transparent 70%); opacity:.12; }
.stat-n {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
}
.stat-n.c { color:var(--cyan); }
.stat-n.g { color:var(--green); }
.stat-n.a { color:var(--amber); }
.stat-lbl { font-size: 11px; color:var(--muted); letter-spacing:.3px; }

.progress-wrap {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
}
.progress-top {
  display: flex; justify-content:space-between;
  font-size: 11px; color:var(--muted); margin-bottom:8px;
  font-family: var(--font-mono);
}
.progress-top span:last-child { color:var(--cyan); font-weight:600; }
.progress-track {
  height: 6px;
  background: var(--s3);
  border-radius: 6px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #006699, var(--cyan), var(--green));
  border-radius: 6px;
  transition: width .7s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.progress-bar::after {
  content:'';
  position:absolute; right:0; top:0; bottom:0; width:20px;
  background: inherit;
  filter: blur(4px);
}

/* ═══════════════════════════════════════
   SECTIONS
═══════════════════════════════════════ */
.sec { padding:10px 14px 0; max-width:760px; margin:0 auto; }
.sec-label {
  font-size: 10px; color:var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 7px;
  display: flex; align-items:center; gap:6px;
}
.sec-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ═══════════════════════════════════════
   FILTER PILLS
═══════════════════════════════════════ */
.filter-strip { display:flex; gap:6px; overflow-x:auto; pb:2px; -ms-overflow-style:none; scrollbar-width:none; }
.filter-strip::-webkit-scrollbar { display:none; }
.fpill {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 40px;
  border: 1px solid var(--border);
  background: var(--s1);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font-bn);
  touch-action: manipulation;
}
.fpill.fa { border-color:rgba(0,212,255,.5); color:var(--cyan); background:var(--cyan-dim); }
.fpill.fp { border-color:rgba(255,179,64,.5); color:var(--amber); background:var(--amber-dim); }
.fpill.fd { border-color:rgba(0,232,135,.5); color:var(--green); background:var(--green-dim); }

/* ═══════════════════════════════════════
   TABS (company / dept / sheet)
═══════════════════════════════════════ */
.tab-strip { display:flex; gap:6px; flex-wrap:wrap; }
.t-btn {
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 40px;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font-mono);
  touch-action: manipulation;
  letter-spacing: .2px;
}
.t-btn.co:hover,.t-btn.co.active { border-color:rgba(255,179,64,.6); color:var(--amber); background:var(--amber-dim); }
.t-btn.dp:hover,.t-btn.dp.active { border-color:rgba(180,124,255,.6); color:var(--purple); background:var(--purple-dim); }
.t-btn.sh.active { border-color:rgba(0,212,255,.6); color:var(--cyan); background:var(--cyan-dim); }

/* ═══════════════════════════════════════
   UPLOAD CARD
═══════════════════════════════════════ */
.upload-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.upload-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: .6;
}
.upload-head {
  display: flex; align-items:center; gap:8px;
  font-family: var(--font-mono); font-size:11px;
  color: var(--cyan); text-transform:uppercase; letter-spacing:1px;
  margin-bottom: 12px;
}
.upload-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.upload-grid-3 { grid-template-columns:1fr 1fr 80px; }
.u-inp {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--r-sm);
  font-size: 13px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  font-family: var(--font-bn);
  width: 100%;
  -webkit-appearance: none;
}
.u-inp:focus { border-color:var(--cyan); box-shadow:0 0 0 2px rgba(0,212,255,.08); }
.u-inp::placeholder { color:var(--muted); }
.u-inp option { background:var(--s2); }
.file-row { display:flex; gap:8px; align-items:stretch; }
.file-pick {
  flex: 1;
  display: flex; align-items:center; gap:8px;
  background: var(--bg);
  border: 1px dashed var(--border2);
  color: var(--muted);
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  overflow: hidden;
}
.file-pick:hover { border-color:var(--cyan); color:var(--cyan); }
.file-pick .fn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#fileInput { display:none; }
.upload-go {
  background: linear-gradient(135deg, #0099bb, var(--cyan));
  color: #020810;
  border: none;
  padding: 10px 20px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-bn);
  transition: opacity .2s, transform .15s;
  touch-action: manipulation;
  white-space: nowrap;
}
.upload-go:hover { opacity:.9; }
.upload-go:active { transform:scale(.97); }
.upload-go:disabled { opacity:.4; cursor:default; }
.u-status {
  margin-top: 8px; font-size:12px; padding:9px 12px;
  border-radius: var(--r-sm); display:none;
}
.u-status.ok  { background:var(--green-dim); border:1px solid rgba(0,232,135,.3); color:var(--green); display:block; }
.u-status.err { background:var(--red-dim); border:1px solid rgba(255,69,96,.3); color:var(--red); display:block; }
.u-status.ing { background:var(--cyan-dim); border:1px solid rgba(0,212,255,.3); color:var(--cyan); display:block; }

/* ═══════════════════════════════════════
   BALANCE ADMIN CARD
═══════════════════════════════════════ */
.bal-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.bal-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
  opacity: .5;
}
.bal-head {
  font-family: var(--font-mono); font-size:10px;
  color:var(--muted); text-transform:uppercase; letter-spacing:1px;
  margin-bottom:6px;
}
.bal-big {
  font-family: var(--font-mono);
  font-size: 32px; font-weight: 700;
  color: var(--green);
  margin-bottom: 14px;
  line-height: 1;
}
.bal-big.low { color:var(--red); }
.bal-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.b-inp {
  flex: 1; min-width:120px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--r-sm);
  font-size:14px; outline:none;
  font-family: var(--font-mono);
  -webkit-appearance: none;
  transition: border-color .2s;
}
.b-inp:focus { border-color:var(--cyan); }
.b-btn {
  padding: 10px 18px;
  border-radius: var(--r-sm);
  border: none;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  font-family: var(--font-bn);
  transition: opacity .2s, transform .15s;
  touch-action: manipulation;
  white-space: nowrap;
}
.b-btn:active { transform:scale(.97); }
.b-btn.add   { background:linear-gradient(135deg,#007733,var(--green)); color:#020810; }
.b-btn.sub   { background:linear-gradient(135deg,#cc7700,var(--amber)); color:#020810; }
.b-btn.reset { background:linear-gradient(135deg,#991122,var(--red)); color:#fff; width:100%; }
.bal-sep { height:1px; background:var(--border); margin:8px 0; }

/* ═══════════════════════════════════════
   RESULTS LABEL
═══════════════════════════════════════ */
.results-lbl {
  font-size:12px; color:var(--muted);
  margin-bottom:10px; display:none;
  font-family: var(--font-mono);
}
.results-lbl em { color:var(--cyan); font-style:normal; }

/* ═══════════════════════════════════════
   LOADER
═══════════════════════════════════════ */
#loader { text-align:center; padding:70px 20px; color:var(--muted); }
.spin-ring {
  width:36px; height:36px;
  border: 3px solid var(--border);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══════════════════════════════════════
   CARDS
═══════════════════════════════════════ */
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 14px 32px;
}

.card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 10px;
  animation: slideUp .3s cubic-bezier(.4,0,.2,1) both;
  transition: border-color .2s, transform .15s, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background: var(--cyan);
  opacity: 0;
  transition: opacity .2s;
  border-radius:3px 0 0 3px;
}
.card:hover::before { opacity:.7; }
.card:hover { border-color:var(--border2); }
.card:active { transform:scale(.993); }
.card.done {
  background: rgba(0,12,6,.7);
  border-color: rgba(0,232,135,.15);
}
.card.done::before { background:var(--green); opacity:.5; }

@keyframes slideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

.card-top {
  display: flex; align-items:flex-start;
  justify-content: space-between;
  gap: 10px; margin-bottom:10px;
}
.card-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  line-height: 1.35;
  flex: 1;
}
.badge-done {
  display: flex; align-items:center; gap:4px;
  background: var(--green-dim);
  border: 1px solid rgba(0,232,135,.3);
  color: var(--green);
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 40px;
  white-space: nowrap;
  letter-spacing: .3px;
  font-family: var(--font-mono);
}

.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.chip {
  display: flex; align-items:center; gap:5px;
  background: var(--s2);
  border: 1px solid var(--border);
  padding: 8px 11px;

.cta-btn {

<script>
/* ══════════════════════════════════════════
   API LAYER  (Neon + Vercel)
   পুরনো google.script.run.* কলগুলো এখন এখান দিয়ে
   /api/* endpoint-এ fetch হয়ে যায়। বাকি কোড অপরিবর্তিত।
══════════════════════════════════════════ */
let adminPass = ""; // সার্ভার-লগইন সফল হলে সেট হয়, admin write-কল-এ হেডারে যায়

function _post(url, body, admin) {
  const headers = { 'Content-Type': 'application/json' };
  if (admin && adminPass) headers['x-admin-pass'] = adminPass;
  return fetch(url, { method: 'POST', headers, body: JSON.stringify(body || {}) }).then(r => r.json());
}
function _apiCall(method, args) {
  switch (method) {
    case 'getSheetList':         return fetch('/api/sheets').then(r => r.json());
    case 'getDataFromSheet':     return fetch('/api/data?sheet=' + encodeURIComponent(args[0] || '')).then(r => r.json());
    case 'getBalance':           return fetch('/api/balance').then(r => r.json());
    case 'setBalance':           return _post('/api/balance', { amount: args[0] }, true);
    case 'deductBalance':        return _post('/api/deduct', { amount: args[0], companyKey: args[1] });
    case 'getCompanySpending':   return fetch('/api/spending').then(r => r.json());
    case 'resetCompanySpending': return _post('/api/spending', { company: args[0] }, true);
    case 'markCompletedOnSheet': return _post('/api/complete', { id: args[0] });
    case 'importCSVToSheet':     return _post('/api/import', { rows: args[0], sheetName: args[1] }, true);
    default: return Promise.reject(new Error('unknown method ' + method));
  }
}
function _makeRun() {
  let onOk = () => {}, onErr = () => {};
  const chain = {
    withSuccessHandler(f) { onOk = f || (() => {}); return chain; },
    withFailureHandler(f) { onErr = f || (() => {}); return chain; }
  };
  ['getSheetList','getDataFromSheet','getBalance','setBalance','deductBalance',
   'getCompanySpending','resetCompanySpending','markCompletedOnSheet','importCSVToSheet']
    .forEach(m => { chain[m] = function () { _apiCall(m, [].slice.call(arguments)).then(r => onOk(r)).catch(e => onErr(e)); }; });
  return chain;
}
const google = window.google || { script: { get run() { return _makeRun(); } } };

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let isAdmin        = false;
let allRows        = [];   // current sheet / combined rows
let allRowsAll     = [];   // for stats (unfiltered)
let currentFilter  = "all";
let currentDept    = "all";
let currentCompany = "all";
let searchQuery    = "";
let currentSheet   = "";
let currentBalance = 0;
let _allSheets     = [];

const MONTH_ORDER  = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

/* ══════════════════════════════════════════
   HEADER ROW DETECTION
══════════════════════════════════════════ */
function isHeaderRow(r) {
  const sl  = String(r[0]||'').toLowerCase().trim();
  const mob = String(r[1]||'').toLowerCase().trim();
  const nm  = String(r[2]||'').toLowerCase().trim();
  if(['sl.no.','sl no','sl','serial','#'].includes(sl)) return true;
  if(['mobile no.','mobile no','mobile','phone','mobile number'].includes(mob)) return true;
  if(nm==='name') return true;
  const allText=r.slice(0,5).every(c=>isNaN(Number(String(c).trim()))||String(c).trim()==='');
  const hasKw=[sl,mob,nm].some(v=>v.includes('dept')||v.includes('bill')||v.includes('status')||v.includes('name'));
  if(allText&&hasKw) return true;
  return false;
}

/* ══════════════════════════════════════════
   SHEET NAME PARSING
══════════════════════════════════════════ */
function parseSheet(name) {
  const m=name.match(/^(.+)_([A-Za-z]+)-(\d{4})$/);
  if(m) return {company:m[1],month:m[2],year:parseInt(m[3])};
  const m2=name.match(/^([A-Za-z]+)-(\d{4})$/);
  if(m2) return {company:'DEFAULT',month:m2[1],year:parseInt(m2[2])};
  return null;
}
function getLatestSheet(sheets) {
  const parsed=sheets.map(n=>({name:n,info:parseSheet(n)})).filter(s=>s.info);
  if(!parsed.length) return sheets[0]||'';
  parsed.sort((a,b)=>{
    if(b.info.year!==a.info.year) return b.info.year-a.info.year;
    return MONTH_ORDER.indexOf(b.info.month)-MONTH_ORDER.indexOf(a.info.month);
  });
  if(currentCompany!=='all'){
    const co=parsed.find(s=>s.info.company===currentCompany);
    if(co) return co.name;
  }
  return parsed[0].name;
}
function getCompanies(sheets) {
  return [...new Set(sheets.map(n=>{const p=parseSheet(n);return p?p.company:null;}).filter(Boolean))].sort();
}
function sheetsForCompany(sheets,company) {
  return sheets
    .filter(n=>{const p=parseSheet(n);return p&&(company==='all'||p.company===company);})
    .sort((a,b)=>{
      const pa=parseSheet(a),pb=parseSheet(b);
      if(pb.year!==pa.year) return pb.year-pa.year;
      return MONTH_ORDER.indexOf(pb.month)-MONTH_ORDER.indexOf(pa.month);
    });
}

/* ══════════════════════════════════════════
   ADMIN
══════════════════════════════════════════ */
function openAdmin(){ document.getElementById('adminPanel').classList.add('open'); setTimeout(()=>document.getElementById('passInp').focus(),120); }
function closeAdmin(){ document.getElementById('adminPanel').classList.remove('open'); document.getElementById('loginErr').textContent=''; document.getElementById('passInp').value=''; }

function doLogin() {
  const val=document.getElementById('passInp').value;
  document.getElementById('loginErr').textContent='যাচাই হচ্ছে...';
  _post('/api/login',{password:val}).then(r=>{
    if(r&&r.success) {
      adminPass=val; isAdmin=true; closeAdmin();
      document.getElementById('adminBtn').style.display='none';
      ['logoutBtn','reportBtn'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
      ['filterSec','sheetSec','uploadSec','balAdminSec'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
      const now=new Date();
      document.getElementById('uploadYear').value=now.getFullYear();
      document.getElementById('uploadMonth').value=MONTH_ORDER[now.getMonth()];
      loadSheetList(); loadBalance(); renderCards();
    } else {
      document.getElementById('loginErr').textContent='⚠️ ভুল পাসওয়ার্ড!';
      document.getElementById('passInp').value='';
      document.getElementById('passInp').focus();
    }
  }).catch(()=>{ document.getElementById('loginErr').textContent='❌ সার্ভার সমস্যা, আবার চেষ্টা করুন'; });
}
function adminLogout() {
  isAdmin=false; adminPass=''; currentFilter='all'; currentDept='all'; currentCompany='all'; searchQuery='';
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  document.getElementById('adminBtn').style.display='';
  ['logoutBtn','reportBtn'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  ['filterSec','sheetSec','uploadSec','balAdminSec'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('sheetTabs').innerHTML='';
  renderCards();
}

function loadBalance() {
  google.script.run
    .withSuccessHandler(r=>{if(r&&r.success)updateBalUI(r.balance);})
    .withFailureHandler(()=>{})
    .getBalance();
}
function updateBalUI(amt) {
  currentBalance=Number(amt)||0;
  const fmt='৳ '+currentBalance.toLocaleString('bn-BD');
  const low=currentBalance<500;
  document.getElementById('balDisplay').textContent=fmt;
  document.getElementById('balDisplay').className='bal-big'+(low?' low':'');
  document.getElementById('balPillAmt').textContent=fmt;
  document.getElementById('balancePill').className='bal-pill'+(low?' low':'');
}
function addBalance() {
  const val=Number(document.getElementById('addBalInp').value);
  if(!val||val<=0){ toast('⚠️ সঠিক পরিমাণ দিন',''); return; }
  google.script.run
    .withSuccessHandler(r=>{ if(r&&r.success){updateBalUI(r.balance);document.getElementById('addBalInp').value='';toast('✅ ৳'+val.toLocaleString()+' যোগ হয়েছে','ok');} })
    .withFailureHandler(()=>toast('❌ ব্যালেন্স আপডেট হয়নি','err'))
    .setBalance(currentBalance+val);
}
function manualDeduct() {
  const val=Number(document.getElementById('dedBalInp').value);
  const note=document.getElementById('dedNoteInp').value.trim()||'manual';
  if(!val||val<=0){ toast('⚠️ সঠিক পরিমাণ দিন',''); return; }
  Swal.fire({
    title:'নিশ্চিত করুন',
    html:`<b style="color:var(--red);font-size:22px">৳${val.toLocaleString()}</b> বাদ দেবেন?<br><small style="color:var(--muted)">${note}</small>`,
    icon:'warning',showCancelButton:true,confirmButtonText:'হ্যাঁ, বাদ দিন',cancelButtonText:'বাতিল',reverseButtons:true
  }).then(r=>{
    if(!r.isConfirmed) return;
    updateBalUI(currentBalance-val);
    google.script.run
      .withSuccessHandler(res=>{ if(res&&res.success){updateBalUI(res.balance);document.getElementById('dedBalInp').value='';document.getElementById('dedNoteInp').value='';toast('✅ ৳'+val.toLocaleString()+' বাদ','ok');} })
      .withFailureHandler(()=>{loadBalance();toast('❌ সমস্যা হয়েছে','err');})
      .deductBalance(val,'manual_'+note);
  });
}
function setBalanceZero() {
  Swal.fire({
    title:'ব্যালেন্স রিসেট?',text:'সম্পূর্ণ ব্যালেন্স শূন্য হবে!',icon:'warning',
    showCancelButton:true,confirmButtonText:'রিসেট',cancelButtonText:'বাতিল',reverseButtons:true
  }).then(r=>{
    if(!r.isConfirmed) return;
    google.script.run.withSuccessHandler(res=>{if(res&&res.success){updateBalUI(0);toast('🔄 রিসেট হয়েছে','info');}}).withFailureHandler(()=>{}).setBalance(0);
  });
}

function openReport() {
  document.getElementById('reportPanel').classList.add('open');
  document.getElementById('repList').innerHTML='<div style="text-align:center;padding:24px;color:var(--muted)">লোড হচ্ছে...</div>';
  google.script.run
    .withSuccessHandler(res=>{
      if(!res||!res.success){ document.getElementById('repList').innerHTML='<div style="color:var(--red);text-align:center">লোড ব্যর্থ</div>'; return; }
      const data=res.data||[];
      const total=data.reduce((s,d)=>s+d.spent,0);
      document.getElementById('repTotal').innerHTML=`মোট খরচ: <strong>৳ ${total.toLocaleString('bn-BD')}</strong>`;
      if(!data.length){ document.getElementById('repList').innerHTML='<div style="color:var(--muted);text-align:center;padding:20px">কোনো খরচ নেই</div>'; return; }
      const mx=Math.max(...data.map(d=>d.spent),1);
      let html='';
      data.sort((a,b)=>b.spent-a.spent).forEach(d=>{
        const pct=Math.round(d.spent/mx*100);
        html+=`<div class="rep-row">
          <div class="rep-row-top">
            <div class="rep-co">🏭 ${d.company}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="rep-am">৳ ${d.spent.toLocaleString('bn-BD')}</div>
              <button class="rep-rst" onclick="resetCompany('${d.company}')">রিসেট</button>
            </div>
          </div>
          <div class="rep-bar"><div class="rep-fill" style="width:${pct}%"></div></div>
        </div>`;
      });
      document.getElementById('repList').innerHTML=html;
    })
    .withFailureHandler(()=>{ document.getElementById('repList').innerHTML='<div style="color:var(--red);text-align:center">লোড ব্যর্থ</div>'; })
    .getCompanySpending();
}
function closeReport(){ document.getElementById('reportPanel').classList.remove('open'); }

   SHEET / COMPANY TABS

function loadSheetList(cb) {
  google.script.run
    .withSuccessHandler(sheets=>{
      _allSheets=sheets||[];
      buildCompanyTabs(_allSheets);
      buildSheetTabs(_allSheets);
      if(cb) cb();
    })
    .withFailureHandler(()=>{ if(cb) cb(); })
    .getSheetList();
}
function buildCompanyTabs(sheets) {
  const cos=getCompanies(sheets).filter(c=>c!=='DEFAULT');
  const sec=document.getElementById('companySec');
  const wrap=document.getElementById('companyTabs');
  if(!cos.length){ sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');
  wrap.innerHTML='';
  const mkBtn=(label,val)=>{
    const b=document.createElement('button');
    b.className='t-btn co'+(currentCompany===val?' active':'');
    b.textContent=label;
    b.onclick=()=>setCompany(val);
    wrap.appendChild(b);
  };
  mkBtn('সব কোম্পানি','all');
  cos.forEach(c=>mkBtn(c,c));
}
function setCompany(c) {
  currentCompany=c; currentDept='all';
  document.querySelectorAll('.t-btn.co').forEach(b=>b.classList.toggle('active',
    (c==='all'&&b.textContent==='সব কোম্পানি')||(c!=='all'&&b.textContent===c)));
  const filtered=sheetsForCompany(_allSheets,c);
  if(filtered.length) currentSheet=filtered[0];
  buildSheetTabs(_allSheets);
  loadData();
}
function buildSheetTabs(sheets) {
  if(!isAdmin) return;
  const filtered=sheetsForCompany(sheets,currentCompany);
  const wrap=document.getElementById('sheetTabs');
  wrap.innerHTML='';
  filtered.forEach(name=>{
    const p=parseSheet(name);
    const label=p?`${p.month.slice(0,3)}-${p.year}`+(p.company!=='DEFAULT'?` (${p.company})`:''):name;
    const b=document.createElement('button');
    b.className='t-btn sh'+(name===currentSheet?' active':'');
    b.textContent=label;
    b.onclick=()=>switchSheet(name);
    wrap.appendChild(b);
  });
}
function switchSheet(name) {
  currentSheet=name; currentDept='all';
  document.querySelectorAll('.t-btn.sh').forEach(b=>{
    const p=parseSheet(name);
    const label=p?`${p.month.slice(0,3)}-${p.year}`+(p.company!=='DEFAULT'?` (${p.company})`:''):name;
    b.classList.toggle('active',b.textContent===label);
  });
  loadData();
}

/* ══════════════════════════════════════════
   LOAD DATA
══════════════════════════════════════════ */
function loadData(forceLatest) {
  document.getElementById('loader').style.display='block';
  document.getElementById('data').innerHTML='';
  document.getElementById('resultsLbl').style.display='none';

  const CLEAN=rows=>(rows||[]).filter(r=>{
    if(r.every(c=>String(c||'').trim()==='')) return false;
    if(isHeaderRow(r)) return false;
    return true;
  });

  const fetchCombined=()=>{
    const cos=getCompanies(_allSheets).filter(c=>c!=='DEFAULT');
    if(!cos.length){ fetchSingle(currentSheet); return; }
    const latestSheets=cos.map(c=>{
      const co=sheetsForCompany(_allSheets,c);
      return co.length?co[0]:null;
    }).filter(Boolean);
    if(!latestSheets.length){ updateStats([]); document.getElementById('loader').style.display='none'; renderCards(); return; }
    let loaded=0,combined=[];
    latestSheets.forEach(sName=>{
      const info=parseSheet(sName);
      const coName=info?info.company:'';
      google.script.run
        .withSuccessHandler(rows=>{
          const filtered=CLEAN(rows);
          const hasActive=filtered.some(r=>String(r[5])!=='Completed');
          if(hasActive){
            // r[6] = company name, r[7] = source sheet name, r[8] = db id
            filtered.forEach(r=>{ r[6]=coName; r[7]=sName; });
            combined=combined.concat(filtered);
          }
          loaded++;
          if(loaded===latestSheets.length){
            allRows=combined; allRowsAll=combined;
            document.getElementById('loader').style.display='none';
            updateStats(combined); buildDeptTabs(combined); renderCards();
          }
        })
        .withFailureHandler(()=>{
          loaded++;
          if(loaded===latestSheets.length){
            allRows=combined; allRowsAll=combined;
            document.getElementById('loader').style.display='none';
            updateStats(combined); buildDeptTabs(combined); renderCards();
          }
        })
        .getDataFromSheet(sName);
    });
  };

  const fetchSingle=sheetName=>{
    if(!sheetName){
      document.getElementById('loader').innerHTML='<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-msg">কোনো শিট নেই। Admin থেকে ফাইল আপলোড করুন।</div></div>';
      updateStats([]); return;
    }
    google.script.run
      .withSuccessHandler(rows=>{
        const cleaned=CLEAN(rows);
        // r[7] = source sheet name
        cleaned.forEach(r=>{ r[7]=sheetName; });
        allRows=cleaned; allRowsAll=cleaned;
        document.getElementById('loader').style.display='none';
        updateStats(cleaned); buildDeptTabs(cleaned); renderCards();
      })
      .withFailureHandler(()=>{
        document.getElementById('loader').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-msg">ডেটা লোড হয়নি</div></div>';
      })
      .getDataFromSheet(sheetName);
  };

  const doFetch=()=>{
    if(currentCompany==='all') fetchCombined();
    else fetchSingle(currentSheet);
  };

  if(forceLatest){
    google.script.run
      .withSuccessHandler(sheets=>{
        _allSheets=sheets||[];
        if(_allSheets.length){
          buildCompanyTabs(_allSheets);
          const latest=getLatestSheet(_allSheets);
          if(latest) currentSheet=latest;
        }
        buildSheetTabs(_allSheets);
        doFetch();
      })
      .withFailureHandler(()=>doFetch())
      .getSheetList();
  } else { doFetch(); }
}

/* ══════════════════════════════════════════
   STATS
══════════════════════════════════════════ */
function updateStats(rows) {
  allRowsAll=rows;
  const total=rows.length;
  const done=rows.filter(r=>String(r[5])==='Completed').length;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statLeft').textContent=total-done;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+'%';
}

/* ══════════════════════════════════════════
   RENDER CARDS
   Row index: [0]Sl [1]Mobile [2]Name [3]Dept [4]Bill [5]Status [6]Company [7]SourceSheet [8]DB id
══════════════════════════════════════════ */
function hl(text,q){
  if(!q||!text) return String(text||'');
  return String(text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
}

function renderCards() {
  const sheetInfo=parseSheet(currentSheet||'');
  const sheetCo=sheetInfo?sheetInfo.company:'';
  let rows=[...allRows];

  if(!isAdmin) rows=rows.filter(r=>String(r[5])!=='Completed');
  else if(currentFilter==='pending')   rows=rows.filter(r=>String(r[5])!=='Completed');
  else if(currentFilter==='completed') rows=rows.filter(r=>String(r[5])==='Completed');

  if(currentDept!=='all') rows=rows.filter(r=>String(r[3]||'').trim()===currentDept);

  if(searchQuery){
    rows=rows.filter(r=>{
      const n=String(r[2]||'').toLowerCase();
      const m=String(r[1]||'');
      const d=String(r[3]||'').toLowerCase();
      return n.includes(searchQuery)||m.includes(searchQuery)||('0'+m).includes(searchQuery)||d.includes(searchQuery);
    });
    const lbl=document.getElementById('resultsLbl');
    lbl.style.display='block';
    lbl.innerHTML=`"<em>${searchQuery}</em>" — ${rows.length} টি রেজাল্ট`;
  } else { document.getElementById('resultsLbl').style.display='none'; }

  if(!rows.length){
    const msg=searchQuery?'কোনো রেজাল্ট নেই':(isAdmin&&currentFilter==='completed')?'কোনো সম্পন্ন এন্ট্রি নেই':'সব বিল পরিশোধ হয়ে গেছে!';
    const icon=searchQuery?'🔍':'✅';
    document.getElementById('data').innerHTML=`<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-msg">${msg}</div></div>`;
    return;
  }

  let html='';
  rows.forEach((r,idx)=>{
    const done=String(r[5])==='Completed';
    const rowIdx=allRows.indexOf(r)+2;
    const name=String(r[2]||'N/A');
    const mobile=String(r[1]||'');
    const bill=r[4]||'';
    const billJs=String(bill).replace(/[^0-9.]/g,'')||'0';   // onclick-এ নিরাপদ সংখ্যা
    const dept=String(r[3]||'');
    const cardCo=String(r[6]||sheetCo||'');
    const srcSheet=String(r[7]||currentSheet||'');
    const rid=(r[8]!=null?r[8]:0);                            // DB row id

    let btns;
    if(!done){
      btns=`<button class="cta-btn primary" id="btn-${rowIdx}" onclick="copyAndComplete('${mobile}',${rowIdx},${billJs},false,'${srcSheet}',${rid})">
        <span>📋</span><span>কপি ও পরিশোধ</span>
      </button>`;
    } else if(isAdmin){
      btns=`<button class="cta-btn done-btn" disabled>✓ পরিশোধ হয়েছে</button>
        <button class="cta-btn ghost" id="btn-${rowIdx}" onclick="copyAndComplete('${mobile}',${rowIdx},${billJs},true,'${srcSheet}',${rid})">📋</button>`;
    } else {
      btns=`<button class="cta-btn done-btn" disabled>✓ পরিশোধ হয়েছে</button>`;
    }

    html+=`<div class="card ${done?'done':''}" id="card-${rowIdx}" style="animation-delay:${idx*.03}s">
      <div class="card-top">
        <div class="card-name">👤 ${searchQuery?hl(name,searchQuery):name}</div>
        ${done?'<div class="badge-done">✓ সম্পন্ন</div>':''}
      </div>
      <div class="chips">
        <div class="chip ph"><span class="ci">📱</span><span class="cv">${searchQuery?hl(mobile,searchQuery):mobile}</span></div>
        <div class="chip am"><span class="ci">💵</span><span class="cv">৳${bill}</span></div>
        ${dept?`<div class="chip dp"><span class="ci">🏢</span><span class="cv">${searchQuery?hl(dept,searchQuery):dept}</span></div>`:''}
        ${cardCo&&cardCo!=='DEFAULT'?`<div class="chip co"><span class="ci">🏭</span><span class="cv">${cardCo}</span></div>`:''}
      </div>
      <div class="btn-row">${btns}</div>
    </div>`;
  });
  document.getElementById('data').innerHTML=html;
}

/* ══════════════════════════════════════════
   COPY & COMPLETE
══════════════════════════════════════════ */
function copyAndComplete(mobile, row, billAmt, adminRecopy, srcSheet, rowId) {
  const text='0'+mobile;

  const sheetToMark=srcSheet||currentSheet;
  const info=parseSheet(sheetToMark||'');
  const coKey=info?info.company:'UNKNOWN';

  const exec=()=>{
    toast('📋 কপি: '+text,'info');
    const btn=document.getElementById('btn-'+row);

    if(adminRecopy){
      if(btn){const o=btn.innerHTML;btn.innerHTML='✓';btn.style.background='rgba(0,232,135,.15)';setTimeout(()=>{if(btn){btn.innerHTML=o;btn.style.background='';}},1500);}
      return;
    }

    if(btn){ btn.classList.remove('primary'); btn.classList.add('success'); btn.innerHTML='<span>✓</span><span>কপি হয়েছে!</span>'; btn.disabled=true; }

    // update local state
    const dr=allRows.find((_,i)=>i+2===row);
    if(dr){ dr[5]='Completed'; }
    if(dr){
      const dr2=allRowsAll.find(rx=>String(rx[1])===String(dr[1])&&String(rx[2])===String(dr[2]));
      if(dr2) dr2[5]='Completed';
    }
    updateStats(allRowsAll);

    // balance deduct
    const deduct=Number(String(billAmt).replace(/[^0-9.]/g,''))||0;
    if(deduct>0){
      updateBalUI(currentBalance-deduct);
      google.script.run
        .withSuccessHandler(r=>{ if(r&&r.success) updateBalUI(r.balance); })
        .withFailureHandler(()=>{})
        .deductBalance(deduct,coKey);
    }

    // animate out (non-admin)
    if(!isAdmin){
      setTimeout(()=>{
        const card=document.getElementById('card-'+row);
        if(card){
          card.style.transition='opacity .4s,transform .4s';
          card.style.opacity='0';
          card.style.transform='translateX(60px) scale(.95)';
          setTimeout(()=>{
            card.remove();
            if(!document.querySelector('.card'))
              document.getElementById('data').innerHTML='<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-msg">সব বিল পরিশোধ হয়ে গেছে!</div></div>';
          },400);
        }
      },900);
    } else {
      setTimeout(()=>renderCards(),700);
    }

    // mark completed on server (by DB id)
    google.script.run
      .withSuccessHandler(()=>{})
      .withFailureHandler(()=>{})
      .markCompletedOnSheet(rowId);
  };

  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); exec();
  };

  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(exec).catch(fallback); }
  else{ fallback(); }
}

/* ══════════════════════════════════════════
   FILE UPLOAD
══════════════════════════════════════════ */
function onFileChosen(){
  const f=document.getElementById('fileInput').files[0];
  document.getElementById('fileNameLbl').textContent=f?f.name:'ফাইল বেছে নিন';
  document.getElementById('uploadStatus').className='u-status';
}

function parseCSV(text){
  return text.trim().split(/\r?\n/).map(line=>{
    const cols=[];let cur='';let q=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){q=!q;}
      else if(line[i]===','&&!q){cols.push(cur.trim());cur='';}
      else{cur+=line[i];}
    }
    cols.push(cur.trim()); return cols;
  });
}
function isHdrClient(r){
  const sl=String(r[0]||'').toLowerCase().trim();
  const mob=String(r[1]||'').toLowerCase().trim();
  const nm=String(r[2]||'').toLowerCase().trim();
  if(['sl.no.','sl no','sl','serial','#'].includes(sl)) return true;
  if(['mobile no.','mobile no','mobile','phone','mobile number'].includes(mob)) return true;
  if(nm==='name') return true;
  const allTxt=r.slice(0,5).every(c=>isNaN(Number(String(c).trim()))||String(c).trim()==='');
  const hasKw=[sl,mob,nm].some(v=>v.includes('dept')||v.includes('bill')||v.includes('status')||v.includes('name'));
  if(allTxt&&hasKw) return true;
  return false;
}
function cleanRows(rows){
  return rows
    .filter(r=>r.some(c=>String(c).trim()!==''))
    .filter(r=>!isHdrClient(r))
    .map(r=>{ while(r.length<6)r.push(''); return r.slice(0,6).map(c=>String(c==null?'':c)); });
}
function parseXLSX(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return cleanRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
}
function uploadFile(){
  const file=document.getElementById('fileInput').files[0];
  const co=document.getElementById('uploadCompany').value.trim().replace(/\s+/g,'_');
  const mo=document.getElementById('uploadMonth').value;
  const yr=document.getElementById('uploadYear').value;
  if(!file){ Swal.fire({icon:'warning',title:'ফাইল বেছে নিন',confirmButtonText:'ঠিক আছে'}); return; }
  if(!co){ Swal.fire({icon:'warning',title:'কোম্পানির নাম দিন',text:'যেমন: IBN_SINA',confirmButtonText:'ঠিক আছে'}); return; }
  if(!yr){ Swal.fire({icon:'warning',title:'বছর লিখুন',confirmButtonText:'ঠিক আছে'}); return; }
  const sheetName=co+'_'+mo+'-'+yr;
  const btn=document.getElementById('uploadGoBtn');
  btn.disabled=true;
  setUpStatus('ing','⏳ ফাইল পড়া হচ্ছে...');
  const ext=file.name.split('.').pop().toLowerCase();
  const rd=new FileReader();
  if(ext==='xlsx'||ext==='xls'){
    rd.onload=e=>{
      try{
        const rows=parseXLSX(e.target.result);
        if(!rows.length){setUpStatus('err','⚠️ XLSX-এ ডেটা নেই');btn.disabled=false;return;}
        setUpStatus('ing',`⏳ ${rows.length} রেকর্ড আপলোড...`);
        sendToServer(rows,sheetName,btn);
      }catch(err){setUpStatus('err','❌ '+err.message);btn.disabled=false;}
    };
    rd.onerror=()=>{setUpStatus('err','❌ ফাইল পড়া যায়নি');btn.disabled=false;};
    rd.readAsArrayBuffer(file);
  } else {
    rd.onload=e=>{
      try{
        const norm=cleanRows(parseCSV(e.target.result));
        if(!norm.length){setUpStatus('err','⚠️ ডেটা রো খালি');btn.disabled=false;return;}
        setUpStatus('ing',`⏳ ${norm.length} রেকর্ড আপলোড...`);
        sendToServer(norm,sheetName,btn);
      }catch(err){setUpStatus('err','❌ '+err.message);btn.disabled=false;}
    };
    rd.onerror=()=>{setUpStatus('err','❌ ফাইল পড়া যায়নি');btn.disabled=false;};
    rd.readAsText(file,'UTF-8');
  }
}
function sendToServer(rows,sheetName,btn){
  google.script.run
    .withSuccessHandler(res=>{
      btn.disabled=false;
      if(res&&res.success){
        setUpStatus('ok',`✅ "${sheetName}" শিটে ${res.rowsAdded} রেকর্ড যোগ!`);
        document.getElementById('fileInput').value='';
        document.getElementById('fileNameLbl').textContent='ফাইল বেছে নিন';
        currentSheet=sheetName;
        const p=parseSheet(sheetName);
        if(p) currentCompany=p.company;
        currentDept='all';
        loadSheetList(()=>loadData());
      } else { setUpStatus('err','❌ '+(res?res.error:'আপলোড ব্যর্থ')); }
    })
    .withFailureHandler(err=>{
      btn.disabled=false;
      setUpStatus('err','❌ '+(err&&err.message?err.message:String(err)));
    })
    .importCSVToSheet(rows,sheetName);
}
function setUpStatus(type,msg){
  const el=document.getElementById('uploadStatus');
  el.className='u-status '+type;
  el.textContent=msg;
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
let _toastTimer;
function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=type?`show ${type}`:'show';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.className='',2600);
}

loadBalance();
setInterval(()=>loadData(true), 60000);
